<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Vida</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }

      .simulation-controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.85);
        color: #ffffff;
        font-family: system-ui, sans-serif;
      }

      .simulation-controls button {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: #2f2f2f;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
      }

      .simulation-controls button:hover {
        background: #444444;
      }

      .simulation-controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .simulation-controls__speed-value {
        min-width: 62px;
        font-size: 13px;
      }

      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="simulation-controls"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
